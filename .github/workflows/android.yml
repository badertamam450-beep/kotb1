name: Build Android APK (كتاب ابدأ من الصفر)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Generate Download Link
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ebda-Men-Al-Sefr-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Direct Download Instructions
        run: |
          echo "================================================="
          echo "✅ APK Built Successfully for Android 15 (SDK 35/36)"
          echo "📥 You can download the APK from the GitHub Actions Artifacts tab:"
          echo "   Name: Ebda-Men-Al-Sefr-APK"
          echo "================================================="
