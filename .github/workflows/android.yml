name: Build Android APK (كتاب ابدأ من الصفر)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Generate Download Link
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Environment and Keystore
        run: |
          # 1. Setup .env file
          touch .env
          if [ -f ".env.example" ]; then
            cp .env.example .env || true
          fi
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

          # 2. Setup debug.keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > debug.keystore || true
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Setup release keystore if provided in secrets
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks || true
          fi

          # 4. Grant execute permissions
          chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Build Android Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --no-build-cache --stacktrace -x test -x lint
        env:
          STORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS || 'androiddebugkey' }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ebda-Men-Al-Sefr-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Direct Download Instructions
        run: |
          echo "================================================="
          echo "✅ APK Built Successfully for Android 15 (SDK 35)"
          echo "📥 You can download the APK from GitHub Actions Artifacts tab:"
          echo "   Artifact Name: Ebda-Men-Al-Sefr-APK"
          echo "================================================="

