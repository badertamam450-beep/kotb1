name: Build Android APK (كتاب ابدأ من الصفر)

"on":
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Generate Download Link
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Keystore & Environment
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch .env
          if [ -f ".env.example" ]; then
            cp .env.example .env || true
          fi
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env

          # Setup release.keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore || true
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > release.keystore || true
          fi

          if [ ! -s release.keystore ]; then
            keytool -genkey -v -keystore release.keystore -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          fi

          # Setup debug.keystore
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Build Android APK
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD || 'android' }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS || 'upload' }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD || 'android' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PATH: release.keystore
        run: |
          gradle :app:assembleRelease :app:assembleDebug --no-daemon --no-configuration-cache --no-build-cache --stacktrace -x test -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ebda-Men-Al-Sefr-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Direct Download Instructions
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Android APK (كتاب ابدأ من الصفر)"
            echo
            echo "✅ The APK was built successfully for Android 15 (SDK 35)."
            echo
            echo "- Artifact: **Ebda-Men-Al-Sefr-APK**"
            echo "- Download Link: [Open this workflow run]($RUN_URL), then download the artifact from the **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"

